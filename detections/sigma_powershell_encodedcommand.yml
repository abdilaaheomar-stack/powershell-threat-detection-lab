title: Suspicious PowerShell EncodedCommand Execution
id: 92c1f1f1-3f0f-4d84-a7a0-111111111111
status: experimental
description: Detects suspicious PowerShell execution using EncodedCommand arguments
author: Abdilaahe Omar
date: 2026/05/07

logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc'

  condition: selection

fields:
  - Image
  - CommandLine
  - ParentImage
  - User

level: high

tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1027
